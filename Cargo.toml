[package]
name = "nos-autoclicker"
version = "0.1.0"
edition = "2024"
description = "Windows 11 gaming autoclicker with configurable click actions, profiles, and safety controls"
license = "MIT"
repository = "https://github.com/nos/nos-autoclicker"

[[bin]]
name = "nos-autoclicker"
path = "src/main.rs"

[dependencies]
eframe = "0.31"
egui = "0.31"
enigo = "0.3"
global-hotkey = "0.6"
device_query = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
rand = "0.8"
directories = "6"

[dev-dependencies]
proptest = "1"

[profile.release]
lto = true
strip = true
codegen-units = 1
